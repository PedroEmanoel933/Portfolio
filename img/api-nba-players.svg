<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="API NBA Players: bola de basquete e resposta JSON" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a50e0"/>
      <stop offset="1" stop-color="#4c2aa8"/>
    </linearGradient>
    <clipPath id="ball">
      <circle cx="590" cy="300" r="150"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- quadra: linhas decorativas -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3">
    <circle cx="590" cy="300" r="230"/>
    <circle cx="590" cy="300" r="300"/>
    <line x1="590" y1="0" x2="590" y2="600"/>
  </g>

  <!-- bola de basquete -->
  <circle cx="590" cy="300" r="150" fill="#f26a1b"/>
  <g clip-path="url(#ball)" fill="none" stroke="#16161a" stroke-width="7" stroke-linecap="round">
    <line x1="590" y1="140" x2="590" y2="460"/>
    <line x1="430" y1="300" x2="750" y2="300"/>
    <path d="M 480 160 C 430 240 430 360 480 440"/>
    <path d="M 700 160 C 750 240 750 360 700 440"/>
  </g>
  <circle cx="590" cy="300" r="150" fill="none" stroke="#16161a" stroke-width="7"/>

  <!-- janela de código JSON -->
  <rect x="50" y="130" width="340" height="270" rx="16" fill="#16161a" fill-opacity=".92"/>
  <circle cx="78" cy="158" r="6" fill="#f26a1b"/>
  <circle cx="98" cy="158" r="6" fill="#2aa7a0"/>
  <circle cx="118" cy="158" r="6" fill="#ecebe6" fill-opacity=".5"/>
  <g font-family="'Courier New', monospace" font-size="22">
    <text x="76" y="212" fill="#2aa7a0">GET /players</text>
    <text x="76" y="256" fill="#ecebe6">{</text>
    <text x="100" y="292" fill="#ecebe6"><tspan fill="#f26a1b">"nome"</tspan>: "...",</text>
    <text x="100" y="328" fill="#ecebe6"><tspan fill="#f26a1b">"time"</tspan>: "...",</text>
    <text x="100" y="364" fill="#ecebe6"><tspan fill="#f26a1b">"posicao"</tspan>: "..."</text>
    <text x="76" y="392" fill="#ecebe6">}</text>
  </g>

  <!-- título -->
  <text x="50" y="500" font-family="'Archivo','Arial Black',Arial,sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">API NBA</text>
  <text x="50" y="556" font-family="'Archivo','Arial Black',Arial,sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">PLAYERS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
