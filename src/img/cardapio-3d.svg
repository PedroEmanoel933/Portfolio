<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Cardápio 3D: cubo isométrico com prato e cardápio digital" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35b8b0"/>
      <stop offset="1" stop-color="#1c7d77"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- linhas decorativas -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="3">
    <circle cx="590" cy="300" r="230"/>
    <circle cx="590" cy="300" r="300"/>
  </g>

  <!-- cubo isométrico -->
  <polygon points="470,230 590,300 590,440 470,370" fill="#16161a"/>
  <polygon points="590,300 710,230 710,370 590,440" fill="#0f5f5a"/>
  <polygon points="590,160 710,230 590,300 470,230" fill="#ecebe6"/>

  <!-- prato em cima do cubo -->
  <ellipse cx="590" cy="232" rx="68" ry="34" fill="#ffffff"/>
  <ellipse cx="590" cy="232" rx="44" ry="22" fill="#f26a1b"/>
  <ellipse cx="578" cy="226" rx="12" ry="6" fill="#ffffff" fill-opacity=".45"/>

  <!-- linhas de cardápio na face esquerda -->
  <g transform="translate(482 262) skewY(30)" fill="#ffffff" fill-opacity=".7">
    <rect x="0" y="0" width="86" height="8" rx="4"/>
    <rect x="0" y="26" width="64" height="8" rx="4"/>
    <rect x="0" y="52" width="76" height="8" rx="4"/>
  </g>

  <!-- 3D na face direita -->
  <g transform="translate(606 396) skewY(-30)">
    <text font-family="'Archivo','Arial Black',Arial,sans-serif" font-weight="900" font-size="64" fill="#ffffff">3D</text>
  </g>

  <!-- cartão do cardápio -->
  <rect x="50" y="130" width="340" height="270" rx="16" fill="#16161a" fill-opacity=".92"/>
  <text x="76" y="176" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#2aa7a0" letter-spacing="3">MENU</text>
  <g font-family="Arial,sans-serif" font-size="22" fill="#ecebe6">
    <text x="76" y="228">Hambúrguer</text>
    <text x="364" y="228" style="text-anchor:end" fill="#f26a1b">R$ 00,00</text>
    <line x1="76" y1="248" x2="364" y2="248" stroke="#ecebe6" stroke-opacity=".2" stroke-width="2"/>
    <text x="76" y="288">Pizza</text>
    <text x="364" y="288" style="text-anchor:end" fill="#f26a1b">R$ 00,00</text>
    <line x1="76" y1="308" x2="364" y2="308" stroke="#ecebe6" stroke-opacity=".2" stroke-width="2"/>
    <text x="76" y="348">Sobremesa</text>
    <text x="364" y="348" style="text-anchor:end" fill="#f26a1b">R$ 00,00</text>
  </g>

  <!-- título -->
  <text x="50" y="500" font-family="'Archivo','Arial Black',Arial,sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">CARDÁPIO</text>
  <text x="50" y="556" font-family="'Archivo','Arial Black',Arial,sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">3D</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
