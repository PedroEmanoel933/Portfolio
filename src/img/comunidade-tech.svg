<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Comunidade Tech: rede de pessoas conectadas e conversas" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a31"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <g id="u">
      <circle r="36" fill="currentColor"/>
      <circle cy="-8" r="10" fill="#16161a"/>
      <path d="M-20 22 a20 20 0 0 1 40 0z" fill="#16161a"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- linhas decorativas -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="3">
    <circle cx="590" cy="300" r="230"/>
    <circle cx="590" cy="300" r="300"/>
  </g>

  <!-- conexões -->
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="3">
    <line x1="590" y1="300" x2="470" y2="150"/>
    <line x1="590" y1="300" x2="730" y2="170"/>
    <line x1="590" y1="300" x2="745" y2="385"/>
    <line x1="590" y1="300" x2="600" y2="490"/>
    <line x1="590" y1="300" x2="450" y2="380"/>
    <line x1="470" y1="150" x2="730" y2="170"/>
    <line x1="745" y1="385" x2="600" y2="490"/>
  </g>

  <!-- pessoas -->
  <use href="#u" x="470" y="150" style="color:#2aa7a0"/>
  <use href="#u" x="730" y="170" style="color:#ecebe6"/>
  <use href="#u" x="745" y="385" style="color:#2aa7a0"/>
  <use href="#u" x="600" y="490" style="color:#f26a1b"/>
  <use href="#u" x="450" y="380" style="color:#ecebe6"/>

  <!-- centro -->
  <circle cx="590" cy="300" r="70" fill="#f26a1b"/>
  <text x="590" y="320" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="52" fill="#ffffff">&lt;/&gt;</text>

  <!-- conversas -->
  <rect x="50" y="130" width="270" height="70" rx="20" fill="#2aa7a0"/>
  <text x="76" y="174" font-family="Arial,sans-serif" font-size="22" fill="#16161a">Como começo em PHP?</text>

  <rect x="110" y="220" width="270" height="70" rx="20" fill="#ecebe6"/>
  <text x="136" y="264" font-family="Arial,sans-serif" font-size="22" fill="#16161a">Veja esse projeto!</text>

  <rect x="50" y="310" width="280" height="70" rx="20" fill="#f26a1b"/>
  <text x="76" y="354" font-family="Arial,sans-serif" font-size="22" fill="#ffffff">Bora codar juntos!</text>

  <!-- título -->
  <text x="50" y="500" font-family="'Archivo','Arial Black',Arial,sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">COMUNIDADE</text>
  <text x="50" y="556" font-family="'Archivo','Arial Black',Arial,sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">TECH</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
